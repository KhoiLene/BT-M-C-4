spring.application.name=muc4
server.port=8082
spring.thymeleaf.enabled=false

# Security
spring.security.user.name=admin
spring.security.user.password=123456
storage.location=C:/uploads
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Database Configuration (Using PostgreSQL from compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Force UTC timezone to avoid "Asia/Saigon" error in PostgreSQL
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
